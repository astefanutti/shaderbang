[project]
name = "shaderbang"
version = "0.1.0"
dependencies = [
    "libevdev",
]
requires-python = ">=3.10"

[project.optional-dependencies]
# Cloth simulation example (examples/cloth.py): NVIDIA Warp GPU physics.
cloth = [
    "warp-lang",
    "numpy",
]
# Path tracer (shaderbang.pathtracer). Also requires, out of band, an NVIDIA
# RTX GPU with CUDA 12.x, the OptiX SDK, and the otk-pyoptix bindings — see
# docs/pathtracer.md. Those are not pip-installable here and are omitted.
pathtracer = [
    "warp-lang",
    "numpy",
    "cupy-cuda12x",
]
authors = [
    { name = "Antonin Stefanutti" },
]
description = "A Python toolkit for OpenGL rendering with EGL/DRM/KMS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
GitHub = "https://github.com/astefanutti/shaderbang"

[project.scripts]
shadertoy = "shaderbang.shadertoy.__main__:main"

[build-system]
requires = ["setuptools>=75.3.2", "build", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp313-manylinux*"
archs = "x86_64 aarch64 armv7l"
before-all = """if command -v yum > /dev/null; then yum install -y libdrm-devel mesa-libgbm-devel mesa-libEGL-devel mesa-libGLES-devel; elif command -v apt-get > /dev/null; then apt-get update && apt-get install -y libdrm-dev libgbm-dev libegl-dev libgles2-mesa-dev; fi"""
